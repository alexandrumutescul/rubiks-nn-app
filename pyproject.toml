[project]
name = "rubiks-nn"
version = "0.1.0"
description = "A small neural network that solves the 3x3x3 Rubik's Cube (doctoral research). 54-sticker state, half-turn metric."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rubiks*"]
