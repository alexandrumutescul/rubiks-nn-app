[project]
name = "rubiks-nn-app"
version = "0.1.0"
description = "A web app that solves the 3x3x3 Rubik's Cube with a small trained policy network and beam search."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["numpy>=2", "torch>=2.4"]

[project.optional-dependencies]
kociemba = ["kociemba"]
dev = ["pytest>=8"]

[project.scripts]
rubiks-nn-serve = "rubiks.serve:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rubiks*"]
